launch:
    - arg: {name: enable_live_approval, default: 'false'}
    - node:
        pkg: spot_tools_ros
        exec: spot_executor_node
        name: spot_executor_node
        param:
            - {name: enable_live_approval, value: $(var enable_live_approval)}
            - from: $(find-pkg-share spot_tools_ros)/config/example_parms.yaml
              allow_substs: true
