/**:
    ros__parameters:
        fixed_frame: "map"
        spot_ip: "10.0.0.3"
        bosdyn_client_username: "$(env BOSDYN_CLIENT_USERNAME)"
        bosdyn_client_password: "$(env BOSDYN_CLIENT_PASSWORD)"
        use_fake_spot_interface: true
        use_fake_spot_pose: true
        fake_spot_x: 0
        fake_spot_y: 0
        fake_spot_yaw: 0
        follower_lookahead: 2
        #semantic_model_path: "(find-pkg-share semantic_inference)/models/ade20k-efficientvit_seg_l2.onnx"
        semantic_model_path: "path_to_semantic_model"
        #labelspace_path: "(find-pkg-share hydra)/config/label_spaces/ade20k_mit_label_space.yaml"
        labelspace_path: "labelspace_path"
        #labelspace_grouping_path: "(find-pkg-share semantic_inference)/config/label_groupings/ade20k_mit.yaml"
        labelspace_grouping_path: "grouping_path"
        # pick: when the operator answers a grasp request with "walk to", stop this
        # far short of the clicked point (meters) before re-detecting, unless the
        # operator chose an explicit stand point.
        pick_walk_to_standoff: 1.0
        # manipulation approval requests: JPEG candidates + registered depth (true,
        # read by the web console) or legacy raw images (false, read by RViz).
        compress_manipulation_requests: true
        # mid-level planner
        mid_level_planner_type: "astar"   # "astar" or "identity"
        lookahead_distance: 50            # grid cells
        occupancy_inflation_radius: 0.2   # meters
        use_fake_path_plan: false
        # cost map: penalizes paths near obstacles (adds proximity cost to A* g_cost)
        use_cost_map: false
        cost_map_safe_distance: 1.0       # meters; cells within this distance incur extra cost
        cost_map_nearest_obstacle_cost: 5.0  # max extra cost per step at zero distance (Gaussian RBF)
