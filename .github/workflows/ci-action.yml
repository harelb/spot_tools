name: Spot Tools CI
run-name: Spot Tools CI
on:
    push:
        branches: main
    pull_request:
        branches:
            - main
            - develop
jobs:
  Spot-Tools-CI:
    runs-on: ubuntu-latest
    strategy:
        matrix:
            python-version: ["3.13"]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
            path: spot_tools_repo
            submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pre-commit
        run: pip install pre-commit && cd ${{ github.workspace }}/spot_tools_repo && pre-commit run --all-files
      - name: Install Spot Tools
        run: |
            pip install ${{ github.workspace }}/spot_tools_repo/spot_tools
            pip install ${{ github.workspace }}/spot_tools_repo/spot_tools_ros
      - name: Install hardware-free test dependencies
        run: |
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
            pip install ultralytics pygame
            pip install ${{ github.workspace }}/spot_tools_repo/robot_executor_interface/robot_executor_interface
      - name: Run hardware-free unit tests
        working-directory: ${{ github.workspace }}/spot_tools_repo
        run: python -m pytest robot_executor_interface/robot_executor_interface/tests spot_tools/test -v
